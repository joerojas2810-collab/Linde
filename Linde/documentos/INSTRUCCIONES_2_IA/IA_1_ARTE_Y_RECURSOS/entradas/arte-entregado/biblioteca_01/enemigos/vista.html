<!doctype html><meta charset="utf-8"><title>LINDE · Enemigos</title>
<style>body{background:#24342b;color:#eee;font:16px system-ui;margin:32px}section{display:inline-block;padding:20px;background:#17241e;margin:12px}canvas{image-rendering:pixelated;background:repeating-conic-gradient(#31473a 0 25%,#2a3d32 0 50%) 0/24px 24px}button,select{font:inherit;margin:6px;padding:6px}</style>
<h1>Biblioteca de enemigos · propuesta</h1><p>Atlas reales. Tiempos provisionales; sin IA ni hitboxes. <a style="color:#d9c080" href="README.md">Límites y método</a></p>
<label>Orientación <select id="dir"><option>Sur</option><option>Este</option><option>Norte</option><option>Oeste</option></select></label>
<label>Acción <select id="action"><option value="idle">Quieto</option><option value="walk" selected>Caminar</option><option value="attack">Ataque</option></select></label><div id="cards"></div>
<script>
const specs=[['slime',32],['guardian',48],['ciervo',48]];const seq={idle:[0],walk:[1,0,2,0],attack:[3,4,0]};let loaded=[];for(const[id,size]of specs){const box=document.createElement('section');box.innerHTML=`<h2>${id}</h2><canvas width="288" height="288"></canvas><p>Celda ${size} px · ampliación 6×</p>`;cards.append(box);const img=new Image();img.src=`nativos/${id}.png`;loaded.push({img,size,ctx:box.querySelector('canvas').getContext('2d')});}function draw(t){const action=document.getElementById('action').value;const frames=seq[action];const col=frames[Math.floor(t/(action==='walk'?150:200))%frames.length];const row=document.getElementById('dir').selectedIndex;for(const{img,size,ctx}of loaded){ctx.clearRect(0,0,288,288);ctx.imageSmoothingEnabled=false;if(img.complete&&img.naturalWidth){const width=size*6;ctx.drawImage(img,col*size,row*size,size,size,(288-width)/2,288-width,width,width);}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
